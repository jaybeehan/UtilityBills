# Paste this into Synology Container Manager -> Project -> Create.
# Your portal passwords go here, on the NAS only. Never put them in GitHub.
services:
  utility-bills:
    image: ghcr.io/jaybeehan/utilitybills:latest
    pull_policy: always          # get the newest version every time you Build
    container_name: utility-bills
    restart: unless-stopped
    shm_size: "1gb"              # the built-in browser needs this
    volumes:
      - ./data:/data             # captures, log and Google key live here
    environment:
      TZ: "America/Edmonton"
      # sync    = normal: check every day at RUN_HOUR
      # once    = test one sync, then stop
      # capture = log in once and save the bill pages (only if a site changes)
      MODE: "sync"
      DRY_RUN: "false"           # "true" = only log what it would add to the sheet
      RUN_HOUR: "7"
      SHEET_ID: "1bo1mBDDxPsKPg5e8BMskq0rOWWfD4Ye9cG4zSN3-KQY"
      SEWER_RATE: "3.00"         # Lacombe wastewater $/m3; usage = treatment charge / this

      ECHO_USERNAME: ""          # CHANGE: your Echo Energy login
      ECHO_PASSWORD: ""          # CHANGE
      LACOMBE_USERNAME: ""       # CHANGE: your City of Lacombe online services login
      LACOMBE_PASSWORD: ""       # CHANGE
